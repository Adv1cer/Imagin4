[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "imaginv4-backend"
version = "0.1.0"
description = "University multi-user AI image-generation platform backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "google-genai>=0.3.0",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "testcontainers>=4.0", "minio>=7.2", "ruff>=0.4", "black>=24.0", "mypy>=1.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs a real Postgres via testcontainers/Docker (see tests/integration/test_postgres_job_queue.py); not run by default unit/e2e passes",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
