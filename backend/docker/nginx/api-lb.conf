# Lightweight round-robin L7 load balancer for the `api` service, used with
# `docker compose up -d --scale api=N nginx ...`. See docker-compose.yml's `nginx`
# service comment for why this exists (2026-08-18 100-VU burst-test incident: a single
# uvicorn process with no replicas and no LB in front of it took the full burst).
#
# Deliberately NOT a static `upstream { server api:8000; }` block: nginx would resolve
# `api` once at startup and cache whichever single container IP it got, so scaling `api`
# afterwards (or a replica being replaced) would silently keep sending all traffic to one
# (possibly dead) container. The `resolver` + variable `proxy_pass` pattern below forces
# nginx to re-resolve `api` against Docker's embedded DNS (127.0.0.11) on every request,
# which returns the current set of replica IPs and lets nginx spread requests across them.
#
# This is a dev/load-test-grade LB: no health-aware routing (a replica that's up but
# unhealthy still gets traffic), no TLS termination, no retries across replicas on
# failure. Swap in a real LB/ingress (the kind docs/architecture.md section 1 describes)
# before this goes anywhere near production traffic.

worker_processes auto;
events {
    worker_connections 2048;
}

http {
    resolver 127.0.0.11 valid=5s;

    # Generation jobs can legitimately take longer than nginx's 60s default proxy
    # timeouts even though POST /v1/generations itself must return 202 almost
    # immediately -- keep the read timeout generous for GET endpoints (job polling, SSE)
    # that share this same LB, rather than time them out at the edge.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 300s;

    server {
        listen 8000;

        location / {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
