# Local dev stack for the Imaginv4 backend. Docker/Postgres/Redis were not available in
# the sandbox this file was authored in, so this compose file is written from the
# repo's Settings (app/core/config.py) and models (app/db/models.py) but has NOT been
# run with `docker compose up` -- see README.md "Known limitations" before relying on it.
#
# Usage (mock ComfyUI -- local dev / CI, no GPU needed):
#   cp .env.example .env   # then edit as needed
#   docker compose --profile mock up -d postgres pgbouncer redis minio minio-init mock-comfyui
#   docker compose run --rm api alembic upgrade head
#   docker compose up -d api scheduler reconciler
#   docker compose --profile load-test run --rm k6 run /scripts/smoke.js   # opt-in only
#
# Usage (real GPU workers -- see comfyui-worker-* below and set APP_COMFY_MODE=live +
# APP_COMFY_WORKER_BASE_URLS_CSV in .env). Listed here with all 4 workers; drop the
# ones you don't want (e.g. just comfyui-worker-1 comfyui-worker-2) and match
# APP_COMFY_WORKER_BASE_URLS_CSV / APP_DEFAULT_COMFY_ACTIVE_SLOTS accordingly:
#   cp .env.example .env   # then edit as needed
#   docker compose up -d postgres pgbouncer redis minio minio-init comfyui-worker-1 comfyui-worker-2 comfyui-worker-3 comfyui-worker-4
#   docker compose run --rm api alembic upgrade head
#   docker compose up -d --build api scheduler reconciler
#
# mock-comfyui is gated behind `--profile mock` on purpose (2026-08): it used to start by
# default and bind host port 8188 unconditionally, which silently collided with a real
# ComfyUI (or comfyui-worker-*) also listening on 8188 on the same host -- requests would
# nondeterministically land on whichever one actually held the port, producing wrong/
# confusing results with no error. Never run mock-comfyui and a real ComfyUI target on
# the same port at the same time.

name: imaginv4

x-app-env: &app-env
  # NOTE: this must be `.env`, NOT `.env.example` -- .env.example is a template only.
  # (This previously pointed at .env.example, silently ignoring anything a user put in
  # their real .env after following the documented `cp .env.example .env` setup step,
  # e.g. a real APP_GEMINI_API_KEY.) Run `cp .env.example .env` before `docker compose
  # up` if you haven't already; compose will fail to start with a clear error if `.env`
  # doesn't exist, rather than silently falling back to placeholder values.
  env_file:
    - .env

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # max_connections bumped from the image default (100) -- 2026-08-18: with a single
    # `api` replica's own pool raised to APP_DB_POOL_SIZE=100 / APP_DB_MAX_OVERFLOW=50
    # (150 possible connections from that one process alone) plus scheduler/reconciler
    # each holding their own small pool, the default 100 doesn't leave enough headroom
    # even with PgBouncer transaction pooling in front. Raise further if you scale `api`
    # to more replicas or add more comfyui-worker orchestrator processes that talk to
    # Postgres directly.
    command: ["postgres", "-c", "max_connections=250"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imaginv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imaginv}
      POSTGRES_DB: ${POSTGRES_DB:-imaginv}
    ports:
      - "5432:5432"
    volumes:
      - imaginv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imaginv} -d ${POSTGRES_DB:-imaginv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-imaginv}:${POSTGRES_PASSWORD:-imaginv}@postgres:5432/${POSTGRES_DB:-imaginv}
      POOL_MODE: transaction
      # 2026-08-18: bumped alongside postgres.max_connections above and
      # APP_DB_POOL_SIZE=100/APP_DB_MAX_OVERFLOW=50 on the api service -- the previous
      # MAX_CLIENT_CONN=500/DEFAULT_POOL_SIZE=25 pairing is what let a 100-VU burst test
      # exhaust the api process's DB pool and take down every in-flight request (see
      # app/core/rate_limit.py's module docstring for the full incident writeup).
      # DEFAULT_POOL_SIZE is the number of real backend connections PgBouncer keeps open
      # to Postgres per (database, user) pair in transaction mode -- every client-side
      # connection (from every api/scheduler/reconciler process, however many replicas)
      # is multiplexed through this many, so it does NOT need to equal
      # MAX_CLIENT_CONN or the app's own pool size, just comfortably cover the real
      # concurrent-transaction rate. Keep it under postgres's max_connections above,
      # with headroom for direct (non-pgbouncer) connections.
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 60
      # postgres:16-alpine defaults password_encryption to scram-sha-256; edoburu/pgbouncer
      # defaults AUTH_TYPE to md5, so without this pgbouncer rejects the upstream login with
      # "wrong password type". Must match Postgres's actual encryption method.
      AUTH_TYPE: scram-sha-256
      # 2026-08-18: added while diagnosing the burst-test `query_wait_timeout` incident --
      # without this, `psql -U imaginv pgbouncer -c "SHOW POOLS;"` fails with "FATAL: not
      # allowed" because no one is authorized to use pgbouncer's admin console (the special
      # `pgbouncer` virtual database) by default. Lets our own app user run SHOW
      # POOLS/SERVERS/CLIENTS/CONFIG against `psql -h pgbouncer -p 5432 -U imaginv
      # pgbouncer` for exactly this kind of live diagnosis.
      ADMIN_USERS: imaginv
    ports:
      - "6432:5432"
    # No reliable healthcheck binary (pg_isready/nc) ships inside this image, so we don't
    # gate on service_healthy for pgbouncer -- dependents wait on service_started instead
    # and retry their own DB connection on boot.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - imaginv_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - imaginv_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/imaginv-assets &&
      mc anonymous set download local/imaginv-assets/generated || true &&
      echo 'minio-init: bucket ready'
      "
    restart: "no"

  mock-comfyui:
    # Placeholder HTTP stand-in for a real ComfyUI instance so `APP_COMFY_MODE=live`
    # can be exercised locally / in k6 load tests without a GPU. Not part of this repo's
    # Python package -- swap for the real ComfyUI image (or point APP_COMFY_BASE_URL at
    # a real GPU host) for production. Uses a tiny static echo server as a stand-in;
    # replace `image` with a maintained mock-comfyui image before relying on this.
    # profiles: only starts with `docker compose --profile mock up ...` -- see the
    # port-collision warning in this file's header comment before removing this.
    image: mendhak/http-https-echo:31
    profiles: ["mock"]
    restart: unless-stopped
    environment:
      HTTP_PORT: "8188"
    ports:
      - "8188:8188"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8188"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real GPU workers, running ComfyUI from source bind-mounted from the host (see
  # docker/comfyui-worker/Dockerfile's comment on the NGC PyTorch base image and why).
  # Started at 2 originally (2026-08 product decision) to benchmark before scaling
  # further; scaled to 4 (comfyui-worker-3/4 below) after that. If these share one
  # physical GPU (e.g. a DGX Spark's single Superchip), more worker containers does not
  # multiply GPU compute, only overlaps otherwise-idle time -- re-benchmark wall-clock
  # throughput whenever you change the count. See Settings.default_comfy_active_slots
  # / comfy_worker_base_urls_csv docstrings in app/core/config.py.
  #
  # Set COMFYUI_HOST_PATH in .env to your actual ComfyUI checkout (the same directory you
  # currently run `python main.py` from natively) -- all workers mount the SAME path
  # read-write, so they share one set of models/custom_nodes/output. Point
  # APP_COMFY_WORKER_BASE_URLS_CSV at whichever of these service names you're running
  # (see .env.example) once they're up, then stop running ComfyUI natively to avoid a
  # second port-8188 collision.
  comfyui-worker-1:
    build: ./docker/comfyui-worker
    restart: unless-stopped
    # --highvram: keep Qwen-Image / TE / VAE resident on the GPU between prompts instead
    # of ComfyUI's default DynamicVRAM path re-"preparing" (and often partially
    # offloading) weights on every got prompt. On a single DGX Spark worker with ~128GB
    # unified memory this is the right trade -- the FP8 Qwen stack (~20GB UNet + ~8GB TE
    # + VAE) fits comfortably, and subsequent jobs skip the per-prompt stage cost. Do
    # NOT add this if you later run multiple workers that each try to keep a full copy
    # resident on the same physical GPU (see MPS_RUNBOOK.md).
    # --disable-all-custom-nodes: Imaginv4's LiveComfyUIClient only needs core nodes.
    # Shared checkout custom_nodes (comfyui-manager, ExtraModels, text overlays) hung
    # main.py at 0% CPU for 40+ minutes after Manager prestartup on DGX Spark
    # (2026-08-21) -- no comfyui.log written, port 8188 RST. Disable for API workers.
    # --user-directory: ComfyUI keeps per-instance state (notably user/comfyui.db, a
    # SQLite file) under <ComfyUI path>/user by default. Both workers bind-mount the
    # SAME host ComfyUI checkout (models/custom_nodes/output are meant to be shared),
    # which means BOTH would otherwise fight over the SAME comfyui.db -- confirmed
    # 2026-08 on Chet's DGX: "Could not acquire lock on database... Another ComfyUI
    # process may already be using it." Currently non-fatal (ComfyUI logs it and starts
    # anyway), but ComfyUI's own warning says the database "will be required" in a
    # future version. Pointing --user-directory at a path INSIDE each container's own
    # filesystem (not the bind mount) gives every worker private, non-conflicting state
    # -- safe to use the identical path string in both services below since each
    # container's root filesystem is already isolated from the other's.
    command: ["--user-directory", "/opt/comfyui-user", "--highvram", "--disable-all-custom-nodes"]
    # NVIDIA MPS: NOT enabled by default. Earlier compose set CUDA_MPS_PIPE_DIRECTORY
    # even when the host MPS daemon was not running; that is NOT inert -- on DGX Spark
    # (2026-08-21) CUDA clients hung indefinitely at first context init (entrypoint
    # torch probe and main.py right after "Setting user directory", 0% CPU). Only add
    # CUDA_MPS_* + /tmp/nvidia-mps mounts AFTER following MPS_RUNBOOK.md (daemon up,
    # control socket present). Keep ipc: host for CUDA shared-memory either way.
    ipc: host
    environment:
      # Unbuffered so docker logs show ComfyUI progress while it boots (otherwise a hang
      # after "Setting user directory" / first torch import looks like a silent freeze).
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${COMFYUI_HOST_PATH:-/home/nvidia/comfyui/ComfyUI}:/workspace/ComfyUI
    ports:
      - "8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8188/system_stats"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s # model loading can take a while on first request

  comfyui-worker-2:
    build: ./docker/comfyui-worker
    restart: unless-stopped
    # See comfyui-worker-1's --user-directory comment above -- same reasoning.
    command: ["--user-directory", "/opt/comfyui-user", "--highvram", "--disable-all-custom-nodes"]
    # NVIDIA MPS: NOT enabled by default. Earlier compose set CUDA_MPS_PIPE_DIRECTORY
    # even when the host MPS daemon was not running; that is NOT inert -- on DGX Spark
    # (2026-08-21) CUDA clients hung indefinitely at first context init (entrypoint
    # torch probe and main.py right after "Setting user directory", 0% CPU). Only add
    # CUDA_MPS_* + /tmp/nvidia-mps mounts AFTER following MPS_RUNBOOK.md (daemon up,
    # control socket present). Keep ipc: host for CUDA shared-memory either way.
    ipc: host
    environment:
      # Unbuffered so docker logs show ComfyUI progress while it boots (otherwise a hang
      # after "Setting user directory" / first torch import looks like a silent freeze).
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${COMFYUI_HOST_PATH:-/home/nvidia/comfyui/ComfyUI}:/workspace/ComfyUI
    ports:
      - "8189:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8188/system_stats"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  # worker-3/worker-4: scaled up from the original 2 per Chet's explicit request
  # (2026-08), AFTER 2-worker dispatch was confirmed reaching real ComfyUI processes.
  # Single-GPU caveat still applies (see comfyui-worker-1's comment above) -- if all 4
  # share one physical GPU (DGX Spark), expect at best partial overlap of otherwise-idle
  # time, not a 4x speedup. Benchmark real wall-clock throughput before assuming this
  # is strictly better than 2; drop back down if 4 doesn't actually help or makes each
  # job slower via VRAM/compute contention.
  comfyui-worker-3:
    build: ./docker/comfyui-worker
    restart: unless-stopped
    # See comfyui-worker-1's --user-directory comment above -- same reasoning.
    command: ["--user-directory", "/opt/comfyui-user", "--highvram", "--disable-all-custom-nodes"]
    # NVIDIA MPS: NOT enabled by default. Earlier compose set CUDA_MPS_PIPE_DIRECTORY
    # even when the host MPS daemon was not running; that is NOT inert -- on DGX Spark
    # (2026-08-21) CUDA clients hung indefinitely at first context init (entrypoint
    # torch probe and main.py right after "Setting user directory", 0% CPU). Only add
    # CUDA_MPS_* + /tmp/nvidia-mps mounts AFTER following MPS_RUNBOOK.md (daemon up,
    # control socket present). Keep ipc: host for CUDA shared-memory either way.
    ipc: host
    environment:
      # Unbuffered so docker logs show ComfyUI progress while it boots (otherwise a hang
      # after "Setting user directory" / first torch import looks like a silent freeze).
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${COMFYUI_HOST_PATH:-/home/nvidia/comfyui/ComfyUI}:/workspace/ComfyUI
    ports:
      - "8190:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8188/system_stats"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  comfyui-worker-4:
    build: ./docker/comfyui-worker
    restart: unless-stopped
    # See comfyui-worker-1's --user-directory comment above -- same reasoning.
    command: ["--user-directory", "/opt/comfyui-user", "--highvram", "--disable-all-custom-nodes"]
    # NVIDIA MPS: NOT enabled by default. Earlier compose set CUDA_MPS_PIPE_DIRECTORY
    # even when the host MPS daemon was not running; that is NOT inert -- on DGX Spark
    # (2026-08-21) CUDA clients hung indefinitely at first context init (entrypoint
    # torch probe and main.py right after "Setting user directory", 0% CPU). Only add
    # CUDA_MPS_* + /tmp/nvidia-mps mounts AFTER following MPS_RUNBOOK.md (daemon up,
    # control socket present). Keep ipc: host for CUDA shared-memory either way.
    ipc: host
    environment:
      # Unbuffered so docker logs show ComfyUI progress while it boots (otherwise a hang
      # after "Setting user directory" / first torch import looks like a silent freeze).
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${COMFYUI_HOST_PATH:-/home/nvidia/comfyui/ComfyUI}:/workspace/ComfyUI
    ports:
      - "8191:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8188/system_stats"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  # Self-hosted Qwen3.8-27B brain via vLLM's OpenAI-compatible server (see
  # app/adapters/qwen.py + app/core/config.py's brain_backend/qwen_* settings). Opt-in:
  # `docker compose --profile brain up -d qwen-brain` -- never started by plain
  # `docker compose up`. Was referenced by .env.example (APP_QWEN_BASE_URL=
  # http://qwen-brain:8000) before this service definition existed here -- added
  # 2026-08-18 while picking this work back up.
  #
  # Replaces chat replies + semantic routing ONLY. Poster/Infographic image generation
  # still needs APP_GEMINI_API_KEY or APP_OPENROUTER_API_KEY regardless of
  # APP_BRAIN_BACKEND -- see Settings.image_provider's docstring in app/core/config.py.
  # There is no local/offline image_provider option; removing both keys breaks Poster/
  # Infographic even with brain_backend=qwen serving chat fine. Ordinary "Image"
  # generation (workflow image_basic) is unaffected either way -- it always uses ComfyUI.
  #
  # ⚠️ VRAM: do not run this alongside all 4 comfyui-worker-* on the one shared GB10 GPU
  # -- see docker/comfyui-worker/MPS_RUNBOOK.md and the still-open 2-vs-4-worker decision
  # in .env. Confirmed via `nvidia-smi` (2026-08-18, Chet's DGX, alongside 2 IDLE
  # comfyui-workers) that VRAM headroom was never actually the blocker at
  # gpu-memory-utilization=0.3 -- the real crash was `ValueError: max_num_seqs (256)
  # exceeds available Mamba cache blocks (46)`: Qwen3.5's hybrid Mamba/Gated-DeltaNet
  # layers need one reserved cache block per concurrent decode sequence, and the ~2.36GiB
  # left over after loading the ~28.5GiB FP8 weights inside a 0.3-utilization budget
  # (~36.5GiB of 121.69GiB total) only fit 46 of them, short of vLLM's default
  # max_num_seqs=256. gpu-memory-utilization=0.4 (~48.7GiB budget, ~20GiB left after
  # weights) comfortably clears that -- chosen over just lowering max_num_seqs because
  # idle comfyui-workers were only using ~170MiB VRAM each at measurement time (they
  # load their model into VRAM per-job, not at container start), leaving ~98GiB
  # genuinely free; 0.4 still leaves ~73GiB for both workers once they're actually
  # generating. Re-check `nvidia-smi` under real concurrent load (brain + both workers
  # generating at once) before trusting this is final -- not benchmarked under load yet.
  qwen-brain:
    image: vllm/vllm-openai:latest
    profiles: ["brain"]
    restart: unless-stopped
    ipc: host
    environment:
      # Qwen3.8-27B-FP8 is a gated/rate-limited repo on some accounts -- set in .env if
      # you hit a 401/403 pull error; harmless empty value otherwise.
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    # --reasoning-parser/--default-chat-template-kwargs (2026-08): Qwen3.8-27B-FP8
    # shares Qwen3.5's chat template, which defaults "thinking" mode ON -- confirmed
    # live that this breaks app/adapters/qwen.py's route_intent() two different ways:
    # (1) guided_json's constrained decoding has to fight the model's instinct to open
    # with a <think> block, which can push grammar compilation/generation past even a
    # 90s client timeout; (2) when it does "think", the emitted answer sometimes lands
    # entirely in the response's reasoning_content field with content left empty --
    # a known vLLM/Qwen3.5 issue (see
    # https://discuss.vllm.ai/t/qwen3-5-only-output-reasoning-and-no-content/2523 and
    # https://github.com/vllm-project/vllm/issues/38894), and our client only ever reads
    # `message.content` (see QwenTextClient._chat). This app has no use for chain-of-
    # thought (classification/short replies only) -- disabling thinking server-side
    # avoids both failure modes for every call, not just route_intent, without touching
    # app/adapters/qwen.py's request payloads.
    command:
      - "--model=Qwen/Qwen3.8-27B-FP8"
      - "--gpu-memory-utilization=0.4"
      - "--max-model-len=8192"
      - "--reasoning-parser=qwen3"
      - '--default-chat-template-kwargs={"enable_thinking": false}'
    volumes:
      # Persists the downloaded checkpoint across container restarts -- without this a
      # `docker compose down`/`up` cycle re-downloads ~27-33GB every time.
      - qwen_hf_cache:/root/.cache/huggingface
    ports:
      - "8100:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s # first run downloads + loads a ~27-33GB checkpoint

  api:
    build: .
    <<: *app-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # No `ports:` here on purpose (2026-08-18) -- a fixed host port mapping is exactly
    # what breaks `docker compose up --scale api=N`, since every replica would fight over
    # the same host port. Reach the API through the `nginx` service below instead, which
    # is the one thing that binds host port 8000 now. A single unscaled `api` container
    # is still reachable at http://api:8000 from other containers on this network (used
    # directly by `docker compose run --rm api alembic upgrade head`, tests, etc).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # L7 load balancer -- see docs/architecture.md's diagram ("Next.js/API client -> L7
  # load balancer -> FastAPI replicas"). 2026-08-18: added because the api service had no
  # load balancer AND no host-scalability in front of it at all -- a single uvicorn
  # process with no `--workers` and no replicas took the full force of a 100-VU burst
  # test. Scale api with `docker compose up -d --scale api=N nginx ...`.
  #
  # IMPORTANT when scaling api beyond 1 replica: APP_DB_POOL_SIZE / APP_DB_MAX_OVERFLOW
  # in .env are PER REPLICA (each api process builds its own SQLAlchemy engine/pool) --
  # divide the single-replica values by N so the fleet's total requested connections
  # stays sane against pgbouncer's DEFAULT_POOL_SIZE/postgres's max_connections above.
  # APP_ADMISSION_MAX_INFLIGHT does NOT need dividing -- it's a fleet-wide cap shared via
  # Redis across every replica already (see app/core/rate_limit.py:AdmissionGate).
  #
  # This nginx config is a lightweight round-robin suitable for local/DGX dev and load
  # testing, not a production-grade LB (no health-aware routing, no TLS termination) --
  # swap in a real LB/ingress for actual production per docs/architecture.md section 1.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./docker/nginx/api-lb.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/v1/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduler:
    build: .
    <<: *app-env
    command: python -m app.services.scheduler
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  reconciler:
    build: .
    <<: *app-env
    command: python -m app.services.reconciler
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # Opt-in only: `docker compose --profile load-test run --rm k6 run /scripts/<name>.js`.
  # Never started by `docker compose up` (no profile => not part of the default set) and
  # must not run in CI by default -- see load_tests/campus_peak.js.
  k6:
    image: grafana/k6:latest
    profiles: ["load-test"]
    volumes:
      - ./load_tests:/scripts:ro
    environment:
      BASE_URL: http://api:8000
      # Pass-through from host shell -- `docker compose run` does NOT forward arbitrary
      # host env vars into the container by itself; without an explicit declaration here
      # (even just naming the var with a default), something like
      # `LOADTEST_AUTH=bearer docker compose run --rm k6 ...` is silently ignored and k6
      # falls back to hundred_concurrent_burst.js's own default (session mode) -- this
      # bit Chet on 2026-08-18 (ran with LOADTEST_AUTH=bearer prefixed, but the burst
      # test still did 100 concurrent POST /v1/auth/login calls and hit the
      # already-documented login-capacity 500s). `${VAR:-default}` syntax means these
      # still work with no host env set at all (falls back to the script's own default).
      LOADTEST_AUTH: ${LOADTEST_AUTH:-session}
      LOADTEST_POLL_TIMEOUT_S: ${LOADTEST_POLL_TIMEOUT_S:-600}
      LOADTEST_USER_COUNT: ${LOADTEST_USER_COUNT:-100}
      LOADTEST_PASSWORD: ${LOADTEST_PASSWORD:-correct-horse-battery-staple}
      LOADTEST_KEYS_FILE: ${LOADTEST_KEYS_FILE:-./loadtest_api_keys.json}
    depends_on:
      - api

volumes:
  imaginv_postgres_data:
  imaginv_redis_data:
  imaginv_minio_data:
  qwen_hf_cache:
